  <!-- Costado de la lupa -->
  <path d="M 35 26 A 9 9 0 0 0 34 31"

  <!-- ============ DEPTH: 2.5D EFFECTS ============ -->
        fill="none" stroke="#4F46E5" stroke-width="1.5" opacity="0.3"/>

