<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_hermano_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_hermano_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_hermano_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_hermano">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="55" rx="12" ry="4" fill="#000" opacity="0.15"/>

  <!-- Cuerpo -->
  <path d="M 23 32 L 28 30 L 42 30 L 47 32 L 45 45 L 25 45 Z"
        fill="url(#grad_hermano_1)" stroke="#4A4A4A" stroke-width="1.5" filter="url(#shadow_hermano)"/>

  <!-- Costado -->
  <path d="M 42 30 L 47 32 L 45 45 L 40 43 Z"
        fill="#4A4A4A" opacity="0.35"/>

  <!-- Brazos -->
  <line x1="25" y1="34" x2="15" y2="36" stroke="#8B8B8B" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="41" y1="34" x2="51" y2="36" stroke="#8B8B8B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cabeza -->
  <circle cx="32" cy="16" r="8" fill="url(#grad_hermano_1)" stroke="#4A4A4A" stroke-width="1.5"/>
  <circle cx="35" cy="14" r="7" fill="#B0B0B0" opacity="0.3"/>

  <!-- Línea de conexión hermano (horizontal punteada) -->
  <line x1="25" y1="30" x2="15" y2="30" stroke="#6B6B6B" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
  </svg>