<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_perfil_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B8B8B;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7A7A7A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_perfil_2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_perfil_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_perfil_4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_perfil">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="55" rx="13" ry="4" fill="#000" opacity="0.15"/>

  <!-- Cabeza de usuario 2.5D -->
  <circle cx="32" cy="20" r="9" fill="url(#grad_perfil_2)" stroke="#4A4A4A" stroke-width="1.5" filter="url(#shadow_perfil)"/>

  <!-- Costado de la cabeza -->
  <path d="M 41 20 A 9 9 0 0 0 40 26"
        fill="none" stroke="#4A4A4A" stroke-width="1.5" opacity="0.3"/>

  <!-- Brillo en cabeza -->
  <ellipse cx="28" cy="15" rx="4" ry="3.5" fill="#B0B0B0" opacity="0.3"/>

  <!-- Cuerpo de usuario 2.5D -->
  <path d="M 20 30 L 24 28 L 40 28 L 44 30 L 43 46 L 21 46 Z"
        fill="url(#grad_perfil_3)" stroke="#4A4A4A" stroke-width="1.5" filter="url(#shadow_perfil)"/>

  <!-- Costado del cuerpo -->
  <path d="M 40 28 L 44 26 L 44 44 L 40 46 Z"
        fill="#4A4A4A" opacity="0.25"/>

  <!-- Brazos -->
  <line x1="21" y1="33" x2="14" y2="35" stroke="#8B8B8B" stroke-width="2" stroke-linecap="round"/>
  <line x1="43" y1="33" x2="50" y2="35" stroke="#8B8B8B" stroke-width="2" stroke-linecap="round"/>
  </svg>