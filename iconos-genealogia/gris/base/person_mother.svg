<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_madre_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_madre_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_madre_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_madre">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="55" rx="14" ry="4" fill="#000" opacity="0.15"/>

  <!-- Profundidad base -->
  <rect x="20" y="28" width="24" height="18" fill="#4A4A4A" opacity="0.2" rx="2"/>

  <!-- Cuerpo (vestido) 2.5D -->
  <path d="M 22 32 L 28 30 L 42 30 L 48 32 L 47 46 L 23 46 Z"
        fill="url(#grad_madre_2)" stroke="#4A4A4A" stroke-width="1.5" filter="url(#shadow_madre)"/>

  <!-- Costado derecho 2.5D -->
  <path d="M 42 30 L 48 32 L 47 46 L 41 44 Z"
        fill="#4A4A4A" opacity="0.4"/>

  <!-- Cabello -->
  <path d="M 24 10 Q 32 6 40 10 L 38 18 Q 32 14 26 18 Z"
        fill="#8B8B8B" opacity="0.7"/>

  <!-- Cabeza -->
  <circle cx="32" cy="18" r="8" fill="url(#grad_madre_2)" stroke="#4A4A4A" stroke-width="1.5"/>
  <circle cx="35" cy="16" r="7" fill="#B0B0B0" opacity="0.3"/>

  <!-- Brazos con curva -->
  <path d="M 24 35 Q 16 34 14 36" stroke="#8B8B8B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M 40 35 Q 48 34 50 36" stroke="#8B8B8B" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  </svg>