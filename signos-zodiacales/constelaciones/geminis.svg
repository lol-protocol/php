<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>Constelación de Géminis (esquema, no a escala)</title>
  <rect width="200" height="200" rx="12" fill="#0b1026"/>
  <g stroke="#8fa3d9" stroke-width="1.5" stroke-linecap="round">
    <line x1="70" y1="30" x2="60" y2="80"/>
    <line x1="60" y1="80" x2="55" y2="130"/>
    <line x1="55" y1="130" x2="45" y2="170"/>
    <line x1="100" y1="30" x2="95" y2="80"/>
    <line x1="95" y1="80" x2="90" y2="130"/>
    <line x1="90" y1="130" x2="80" y2="170"/>
    <line x1="60" y1="80" x2="95" y2="80"/>
    <line x1="55" y1="130" x2="90" y2="130"/>
  </g>
  <g fill="#ffffff">
    <circle cx="70" cy="30" r="2.8"/>
    <circle cx="100" cy="30" r="2.8"/>
    <circle cx="60" cy="80" r="2.8"/>
    <circle cx="95" cy="80" r="2.8"/>
    <circle cx="55" cy="130" r="2.8"/>
    <circle cx="90" cy="130" r="2.8"/>
    <circle cx="45" cy="170" r="2.8"/>
    <circle cx="80" cy="170" r="2.8"/>
  </g>
  <text x="100" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c9d3f0">Géminis</text>
</svg>
