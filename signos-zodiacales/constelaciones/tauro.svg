<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>Constelación de Tauro (esquema, no a escala)</title>
  <rect width="200" height="200" rx="12" fill="#0b1026"/>
  <g stroke="#8fa3d9" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="70" x2="70" y2="95"/>
    <line x1="70" y1="95" x2="100" y2="115"/>
    <line x1="100" y1="115" x2="75" y2="140"/>
    <line x1="100" y1="115" x2="120" y2="135"/>
    <line x1="120" y1="135" x2="130" y2="100"/>
    <line x1="130" y1="100" x2="160" y2="70"/>
  </g>
  <g fill="#ffffff">
    <circle cx="40" cy="70" r="2.8"/>
    <circle cx="70" cy="95" r="2.8"/>
    <circle cx="100" cy="115" r="2.8"/>
    <circle cx="75" cy="140" r="2.8"/>
    <circle cx="120" cy="135" r="2.8"/>
    <circle cx="130" cy="100" r="2.8"/>
    <circle cx="160" cy="70" r="2.8"/>
  </g>
  <text x="100" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c9d3f0">Tauro</text>
</svg>
