name: vps-setup

on:
  push:
    branches: ['**']
    paths: ['vps-setup/**', '.github/workflows/vps-setup.yml']
  pull_request:
    branches: ['**']
    paths: ['vps-setup/**', '.github/workflows/vps-setup.yml']

jobs:
  scripts:
    name: Scripts (syntax, ShellCheck, bats)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Syntax check (bash -n)
        run: |
          for f in vps-setup/*.sh vps-setup/monitoring/*.sh; do
            bash -n "$f"
          done

      # -S warning: avisos y errores. Los avisos de estilo (comillas en variables
      # que a proposito se dividen, etc.) no bloquean.
      - name: ShellCheck
        run: shellcheck -S warning vps-setup/*.sh vps-setup/monitoring/*.sh

      - name: Install bats and logrotate
        run: sudo apt-get update && sudo apt-get install -y bats logrotate

      - name: Tests (bats)
        run: bats vps-setup/tests

  # Pruebas con nginx, logrotate y sshd REALES, directamente en el runner (sin Docker).
  # Escriben en /etc y /var: el runner es desechable. Solo se activan con REAL_TESTS=1.
  real-tools:
    name: Real tools (nginx, sshd, BIND, fail2ban, certbot)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y bats nginx logrotate openssh-server dnsutils bind9 bind9utils fail2ban python3-systemd certbot python3-certbot-nginx

      # Un nginx preinstalado/arrancado en el runner ocuparia el puerto 80.
      - name: Stop preinstalled services (nginx, apache, systemd-resolved)
        run: sudo systemctl stop nginx apache2 systemd-resolved 2>/dev/null || true   # resolved ocupa el puerto 53 (test de named)

      # Un test saltado (herramienta ausente, puerto 80 ocupado, no root) saldria en
      # verde sin probar nada: aqui un skip o menos de 23 tests ejecutados es un fallo.
      - name: Tests con herramientas reales (bats)
        run: |
          sudo -E env "PATH=$PATH" REAL_TESTS=1 bats --tap vps-setup/tests/real | tee real.tap
          if grep -q '# skip' real.tap; then echo "::error::hay tests reales saltados"; exit 1; fi
          test "$(grep -c '^ok ' real.tap)" -ge 23

      # Se paro systemd-resolved para liberar el puerto 53: sin DNS el runner no puede cerrar el job.
      - name: Restaurar DNS del runner
        if: always()
        run: sudo systemctl start systemd-resolved
