<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_conectar_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_conectar_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_conectar_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_conectar">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="55" rx="14" ry="3" fill="#000" opacity="0.15"/>

  <!-- Círculo izquierdo (persona 1) -->
  <circle cx="20" cy="32" r="8" fill="url(#grad_conectar_1)" stroke="#4A4A4A" stroke-width="1.5" filter="url(#shadow_conectar)"/>
  <circle cx="22" cy="30" r="6" fill="#B0B0B0" opacity="0.25"/>

  <!-- Círculo derecho (persona 2) -->
  <circle cx="44" cy="32" r="8" fill="url(#grad_conectar_2)" stroke="#4A4A4A" stroke-width="1.5" filter="url(#shadow_conectar)"/>
  <circle cx="46" cy="30" r="6" fill="#B0B0B0" opacity="0.25"/>

  <!-- Línea de conexión con flecha -->
  <line x1="28" y1="32" x2="36" y2="32" stroke="#8B8B8B" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Punta de flecha -->
  <polygon points="38,32 35,30 35,34" fill="#8B8B8B"/>

  <!-- Punto central de conexión -->
  <circle cx="32" cy="32" r="2.5" fill="#8B8B8B" filter="url(#shadow_conectar)"/>
  </svg>