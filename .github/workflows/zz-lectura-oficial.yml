name: zz lectura de textos oficiales (temporal, no fusionar)

# Rama desechable: el contenedor de la sesión no llega a los sitios oficiales, pero los runners sí.
# Baja cada URL, la pasa a texto y escribe en el log los fragmentos que mencionan las palabras clave.
on:
  push:
    branches: ['ccr-d425058a-7zjtb4-fetch']

permissions:
  contents: read

jobs:
  leer:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - run: python3 .github/scripts/zz_leer.py
