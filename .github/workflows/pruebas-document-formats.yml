name: Pruebas document-formats

# Misma convencion que los demas proyectos del repo: solo cuando cambia este
# proyecto (o este archivo), en los pull requests y en master.

on:
  push:
    branches: [master]
    paths:
      - "document-formats/**"
      - ".github/workflows/pruebas-document-formats.yml"
  pull_request:
    paths:
      - "document-formats/**"
      - ".github/workflows/pruebas-document-formats.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  document-formats:
    name: document-formats (Node)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Run tests
        run: node --test 'document-formats/tests/*.test.js'

  document-formats-database:
    name: document-formats (${{ matrix.name }} import)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # El README promete las dos bases: MySQL 8.0 y MariaDB 10.11.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: MySQL
            image: mysql:8.0
          - name: MariaDB
            image: mariadb:10.11

    services:
      mysql:
        image: ${{ matrix.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formats
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=formats;charset=utf8mb4
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Create the schema and import the CSV files
        run: php document-formats/import_database.php --create-schema

      - name: Import again, to check re-runs don't duplicate rows
        run: php document-formats/import_database.php

      - name: Check the database against the CSV files
        run: php document-formats/tests/database_check.php

  # Abre la demo (document-formats/app/index.html) en Chromium: los 30 idiomas, el botón «Copiar enlace», la
  # búsqueda con palabras traducidas, el conversor y que ninguna pestaña desborde en 320 px. Lo que `node --test`
  # no ve porque no hay navegador.
  document-formats-navegador:
    name: document-formats (demo en Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Solo la biblioteca de Python: el navegador lo pone setup-chrome.
      - name: Instalar Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pip install playwright==1.55.0

      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Demo en Chromium
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: python document-formats/tests/pruebas_navegador.py
