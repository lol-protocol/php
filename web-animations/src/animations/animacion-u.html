<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación U - Reloj</title>
    <link rel="stylesheet" href="../helpers/common.css">
    <link rel="stylesheet" href="animacion-u.css">
</head>
<body class="fullscreen-container">
    <div class="info-panel">
        <h2>U) Reloj Analógico Animado</h2>
        <p>Manecillas de reloj rotando marcando la hora real.</p>
    </div>

    <div class="clock">
        <div class="hand hour"></div>
        <div class="hand minute"></div>
        <div class="hand second"></div>
        <div class="center"></div>
    </div>

    <button class="control-btn" onclick="toggle.toggle()">Pausar/Reanudar</button>
    <script src="../helpers/common.js"></script>
    <script src="animacion-u.js"></script>
</body>
</html>
