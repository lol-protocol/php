<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación A - Vuelo 3D</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 30px;
        }

        .scene {
            perspective: 1200px;
            width: 90vw;
            height: 600px;
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.1);
        }

        .rectangle {
            width: 20vw;
            height: 15vh;
            background: linear-gradient(45deg, #ff6b6b, #ee5a6f);
            position: absolute;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border-radius: 8px;
            animation: flyAndRotate 3s ease-in-out infinite;
            transform-style: preserve-3d;
        }

        .rectangle::before {
            content: 'Vuelo 3D';
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            font-size: 1.2em;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        @keyframes flyAndRotate {
            0% {
                left: 50%;
                top: 62%;
                transform: translateX(-50%) translateY(-50%)
                          rotateX(0deg) rotateY(0deg) rotateZ(0deg);
                opacity: 1;
            }

            50% {
                transform: translateX(-50%) translateY(-50%)
                          rotateX(180deg) rotateY(180deg) rotateZ(45deg);
                opacity: 0.9;
            }

            100% {
                left: 0;
                top: 0;
                transform: translateX(0) translateY(0)
                          rotateX(360deg) rotateY(360deg) rotateZ(0deg);
                opacity: 1;
            }
        }

        .info {
            color: white;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            font-size: 14px;
            max-width: 600px;
            text-align: center;
        }

        .info h2 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        button {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="info">
        <h2>Animación A: Vuelo 3D con Rotación</h2>
        <p>Rectángulo centrado al 62% de la pantalla que rota en 3D y vuela a la esquina superior izquierda. Ancho: 20% de la pantalla.</p>
    </div>

    <div class="scene">
        <div class="rectangle"></div>
    </div>

    <button onclick="toggleAnimation()">Pausar/Reanudar</button>

    <script>
        let isAnimating = true;

        function toggleAnimation() {
            const rectangle = document.querySelector('.rectangle');
            if (isAnimating) {
                rectangle.style.animationPlayState = 'paused';
                document.querySelector('button').textContent = 'Reanudar';
            } else {
                rectangle.style.animationPlayState = 'running';
                document.querySelector('button').textContent = 'Pausar/Reanudar';
            }
            isAnimating = !isAnimating;
        }
    </script>
</body>
</html>
