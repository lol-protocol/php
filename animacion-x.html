<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación X - Rayos Fractal</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="animacion-x.css">
</head>
<body class="fullscreen-container">
    <div class="info-panel">
        <h2>X) Rayos Fractal</h2>
        <p>Ramificaciones fractales que crecen dinámicamente desde el centro.</p>
    </div>

    <svg class="fractal-svg" viewBox="0 0 400 400" width="400" height="400">
        <g class="fractal-group">
            <line class="ray ray-0" x1="200" y1="200" x2="200" y2="50"/>
            <line class="ray ray-1" x1="200" y1="200" x2="350" y2="200"/>
            <line class="ray ray-2" x1="200" y1="200" x2="200" y2="350"/>
            <line class="ray ray-3" x1="200" y1="200" x2="50" y2="200"/>
            <line class="ray ray-4" x1="200" y1="200" x2="320" y2="80"/>
            <line class="ray ray-5" x1="200" y1="200" x2="320" y2="320"/>
            <line class="ray ray-6" x1="200" y1="200" x2="80" y2="320"/>
            <line class="ray ray-7" x1="200" y1="200" x2="80" y2="80"/>
        </g>
    </svg>

    <button class="control-btn" onclick="toggle.toggle()">Pausar/Reanudar</button>
    <script src="common.js"></script>
    <script src="animacion-x.js"></script>
</body>
</html>
