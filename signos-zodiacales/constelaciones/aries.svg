<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>Constelación de Aries (esquema, no a escala)</title>
  <rect width="200" height="200" rx="12" fill="#0b1026"/>
  <g stroke="#8fa3d9" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="150" x2="65" y2="120"/>
    <line x1="65" y1="120" x2="105" y2="95"/>
    <line x1="105" y1="95" x2="140" y2="70"/>
    <line x1="140" y1="70" x2="170" y2="50"/>
  </g>
  <g fill="#ffffff">
    <circle cx="30" cy="150" r="2.8"/>
    <circle cx="65" cy="120" r="2.8"/>
    <circle cx="105" cy="95" r="2.8"/>
    <circle cx="140" cy="70" r="2.8"/>
    <circle cx="170" cy="50" r="2.8"/>
  </g>
  <text x="100" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c9d3f0">Aries</text>
</svg>
