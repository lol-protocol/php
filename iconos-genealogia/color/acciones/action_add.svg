<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_anadir_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_anadir_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_anadir_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_anadir">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="55" rx="14" ry="4" fill="#000" opacity="0.15"/>

  <!-- Círculo base 2.5D -->
  <circle cx="32" cy="32" r="13" fill="url(#grad_anadir_3)" stroke="#047857" stroke-width="1.5" filter="url(#shadow_anadir)"/>

  <!-- Costado del círculo (profundidad) -->
  <path d="M 45 32 A 13 13 0 0 0 44 38"
        fill="none" stroke="#047857" stroke-width="1.5" opacity="0.3"/>

  <!-- Brillo (reflejo) -->
  <ellipse cx="28" cy="26" rx="5" ry="4" fill="#34D399" opacity="0.3"/>

  <!-- Signo + -->
  <!-- Línea vertical -->
  <line x1="32" y1="24" x2="32" y2="40" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Línea horizontal -->
  <line x1="24" y1="32" x2="40" y2="32" stroke="#FFF" stroke-width="2.5" stroke-linecap="round"/>
  </svg>