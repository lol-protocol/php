name: Pruebas phone-directory

# Misma convencion que los demas proyectos del repo: solo cuando cambia este
# proyecto (o este archivo), en los pull requests y en master.
# Tambien cuando cambia defamatory-content-review/: phone-directory lo usa como
# dependencia local (repositorio `path` de su composer.json).

on:
  push:
    branches: [master]
    paths:
      - "phone-directory/**"
      - "defamatory-content-review/**"
      - ".github/workflows/pruebas-phone-directory.yml"
  pull_request:
    paths:
      - "phone-directory/**"
      - "defamatory-content-review/**"
      - ".github/workflows/pruebas-phone-directory.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  phone-directory:
    name: phone-directory / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-directory
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phonedir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_pgsql
          coverage: none
          tools: phpstan:2.1

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        env:
          PHONEDIR_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=phonedir_test;user=postgres;password=postgres
        run: ./vendor/bin/phpunit

      - name: Static analysis
        run: phpstan analyse --no-progress

      - name: Benchmark smoke run
        run: php bin/benchmark.php 2000

  phone-directory-ports:
    name: phone-directory / Python and Java ports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-directory/ports

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Python port tests
        working-directory: phone-directory/ports/python
        run: python -m unittest -v

      - name: Java port checks
        working-directory: phone-directory/ports/java
        run: |
          javac -encoding UTF-8 -d build *.java
          java -cp build PhoneDirectoryParserTest
