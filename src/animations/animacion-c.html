<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación C - Página 3D</title>
    <link rel="stylesheet" href="../../helpers/common.css">
    <link rel="stylesheet" href="animacion-c.css">
</head>
<body class="fullscreen-container">
    <div class="info-panel">
        <h2>C) Página Volteándose en 3D</h2>
        <p>Un libro/página se voltea en 3D mostrando ambos lados.</p>
    </div>

    <div class="page-container">
        <div class="page">
            <div class="page-front">Página 1</div>
            <div class="page-back">Página 2</div>
        </div>
    </div>

    <button class="control-btn" onclick="toggle.toggle()">Pausar/Reanudar</button>
    <script src="../../helpers/common.js"></script>
    <script>
        const toggle = new AnimationToggle('.page');
    </script>
</body>
</html>
