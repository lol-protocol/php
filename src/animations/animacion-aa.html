<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación AA - Prisma</title>
    <link rel="stylesheet" href="../../helpers/common.css">
    <link rel="stylesheet" href="animacion-aa.css">
</head>
<body class="fullscreen-container">
    <div class="info-panel">
        <h2>AA) Prisma de Luz</h2>
        <p>Rayos de luz refractándose a través de un prisma.</p>
    </div>

    <div class="prism-container">
        <div class="prism"></div>
        <div class="light-ray ray-1"></div>
        <div class="light-ray ray-2"></div>
        <div class="light-ray ray-3"></div>
    </div>

    <button class="control-btn" onclick="toggle.toggle()">Pausar/Reanudar</button>
    <script src="../../helpers/common.js"></script>
    <script src="animacion-aa.js"></script>
</body>
</html>
