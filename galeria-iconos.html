  .group-title .count { color: #888; font-weight: 400; font-size: .9em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .icon { background: #f8f9ff; border-radius: 8px; padding: 10px; text-align: center; }
  .icon:hover { background: #e8eaff; }
  .variants { display: flex; gap: 4px; justify-content: center; }
  .variants img { width: 56px; height: 56px; background: #fff; border-radius: 4px; }
  .icon figcaption { margin-top: 6px; font-size: .78em; color: #555; word-break: break-all; }

  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

  return set.groups.reduce((sum, g) => sum + g.items.length, 0);
