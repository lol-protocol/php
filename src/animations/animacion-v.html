<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación V - Brújula</title>
    <link rel="stylesheet" href="../../helpers/common.css">
    <link rel="stylesheet" href="animacion-v.css">
</head>
<body class="fullscreen-container">
    <div class="info-panel">
        <h2>V) Brújula Girando</h2>
        <p>Una brújula que gira y apunta a direcciones cardinales.</p>
    </div>

    <div class="compass-container">
        <div class="compass">
            <div class="markings">
                <span class="mark n">N</span>
                <span class="mark e">E</span>
                <span class="mark s">S</span>
                <span class="mark w">W</span>
            </div>
            <div class="needle"></div>
            <div class="center-circle"></div>
        </div>
    </div>

    <button class="control-btn" onclick="toggle.toggle()">Pausar/Reanudar</button>
    <script src="../../helpers/common.js"></script>
    <script src="animacion-v.js"></script>
</body>
</html>
