name: Pruebas interruptores

on:
  push:
    branches: [master]
    paths:
      - "interruptores/**"
      - ".github/workflows/pruebas-interruptores.yml"
  pull_request:
    paths:
      - "interruptores/**"
      - ".github/workflows/pruebas-interruptores.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    name: Pruebas (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3", "8.4"]

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Los scripts compilan
        run: |
          for f in interruptores/src/*.php interruptores/bin/*.php interruptores/panel/*.php interruptores/pruebas/*.php; do php -l "$f"; done

      - name: Pruebas del catálogo, de las dependencias y del estado
        run: php interruptores/pruebas/ejecutar.php

      - name: Panel en vivo (login, roles, CSRF, bloqueo y cierre de sesión, con php -S)
        run: php interruptores/pruebas/panel.php

      - name: FUNCIONES.md al día con catalogo.json
        run: php interruptores/bin/generar.php --comprobar
