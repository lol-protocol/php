name: Pruebas portadas SVG

on:
  push:
    branches: [master]
    paths:
      - "portadas-svg/**"
      - ".github/workflows/pruebas-portadas-svg.yml"
  pull_request:
    paths:
      - "portadas-svg/**"
      - ".github/workflows/pruebas-portadas-svg.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pruebas:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: portadas-svg

    steps:
      - uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: dom, mbstring
          coverage: none
          tools: phpstan:2.1

      - name: composer.json válido
        run: composer validate --strict

      - name: Pruebas unitarias
        run: php pruebas/ejecutar.php

      - name: ejemplos/salida al día con el generador
        run: php bin/generar.php --comprobar

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Herramientas de Python (fuentes, kerning y regresión visual)
        run: |
          pip install fonttools brotli uharfbuzz resvg-py Pillow
          python3 -m unittest discover -s herramientas/pruebas -v
          mkdir /tmp/kerning && cd /tmp/kerning
          npm pack @expo-google-fonts/inter@0.4.2 @expo-google-fonts/source-serif-4@0.4.2
          for f in *.tgz; do d=${f%.tgz}; mkdir $d; tar xzf $f -C $d; done
          cd "$GITHUB_WORKSPACE/portadas-svg"
          python3 herramientas/kerning.py /tmp/kerning --comprobar
          python3 herramientas/pruebas/visual.py

      - name: Análisis estático (PHPStan)
        run: phpstan analyse --no-progress
