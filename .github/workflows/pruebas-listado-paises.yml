name: Pruebas Listado-paises

# Misma convencion que los demas proyectos del repo: solo cuando cambia este
# proyecto (o este archivo), en los pull requests y en master.

on:
  push:
    branches: [master]
    paths:
      - "Listado-paises/**"
      - ".github/workflows/pruebas-listado-paises.yml"
  pull_request:
    paths:
      - "Listado-paises/**"
      - ".github/workflows/pruebas-listado-paises.yml"
  workflow_dispatch:
  # El día 3 de cada mes: el grapher de OWID y la API del Banco Mundial no tienen versiones
  # fijas, así que el job reproducir avisa (falla) si alguna de las dos cambió.
  schedule:
    - cron: "17 5 3 * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  listado-paises:
    if: github.event_name != 'schedule'
    name: "Listado-paises: CSV válidos, tablas al día y pruebas"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Valida paises.csv, paises_pos.csv y niveles_lenguas.csv (IP es el maximo de las
      # lenguas, IP local el de la primera) y falla si tabla_genealogia.md o
      # tabla_pos.md no coinciden con lo que generan esos CSV.
      - name: Comprobar datos y tablas
        working-directory: Listado-paises
        run: python3 generar_tabla.py --comprobar

      # Interpolacion, suma de nacimientos y reglas de historia_poblacion.py, con
      # series sinteticas de resultado conocido.
      - name: Pruebas
        working-directory: Listado-paises
        run: python3 -m unittest -v pruebas

  # Abre vista.html en Chromium (escritorio y móvil) y prueba mapa, tabla, filtros, orden,
  # búsqueda sin acentos, escenarios, marcas «≠ datos» y tooltip. Las cifras esperadas salen de
  # los CSV del proyecto.
  navegador:
    name: "Listado-paises: vista.html en Chromium"
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      # Solo la biblioteca de Python: el navegador lo pone setup-chrome.
      - name: Instalar Playwright
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
        run: pip install playwright==1.55.0

      - uses: browser-actions/setup-chrome@v2
        id: chrome

      - name: Vista en Chromium
        working-directory: Listado-paises
        env:
          CHROMIUM: ${{ steps.chrome.outputs.chrome-path }}
        run: python pruebas_navegador.py

  # Al lanzarlo a mano (workflow_dispatch) y una vez al mes (schedule): baja las fuentes fijadas por commit,
  # comprueba su SHA-256 contra fuentes.sha256, rehace todos los datos y falla si algún
  # archivo del proyecto cambia. Tarda menos de un minuto y baja unos 35 MB.
  reproducir:
    name: "Listado-paises: los datos se rehacen idénticos desde las fuentes"
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bajar fuentes y rehacer los datos
        working-directory: Listado-paises
        run: python3 descargar_fuentes.py --destino "$RUNNER_TEMP/fuentes" --rehacer

      - name: Comprobar que nada cambió
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
