<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_buscar_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_buscar_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_buscar_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_buscar">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <!-- ============ SHADOW: BASE SHADOW ============ -->
  <ellipse cx="32" cy="55" rx="12" ry="3" fill="#000" opacity="0.15"/>

  <!-- Círculo de lupa 2.5D -->
  <circle cx="26" cy="26" r="10" fill="url(#grad_buscar_1)" stroke="#1E40AF" stroke-width="1.5" filter="url(#shadow_buscar)"/>

  <!-- Costado del círculo (profundidad) -->
  <path d="M 36 26 A 10 10 0 0 0 35 32"

  <!-- ============ DEPTH: 2.5D EFFECTS ============ -->
        fill="none" stroke="#1E40AF" stroke-width="1.5" opacity="0.3"/>

  <!-- Brillo -->
  <ellipse cx="21" cy="21" rx="4" ry="3" fill="#60A5FA" opacity="0.3"/>

  <!-- Mango de la lupa -->

  <!-- ============ DETAILS: ACCESSORIES & FEATURES ============ -->
  <line x1="35" y1="35" x2="46" y2="46" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Punta del mango -->

  <!-- ============ BODY: MAIN FIGURE ============ -->
  <circle cx="46" cy="46" r="1.5" fill="#3B82F6"/>

  <!-- Línea de búsqueda (representa resultados) -->
  <line x1="20" y1="26" x2="32" y2="26" stroke="#FFF" stroke-width="1.5" opacity="0.8"/>
  </svg>