# Taxonomía de marcalibros v0.7. Fuente de verdad para generator/build.py.
#
# - Cada variante de un autor es una obra o tema suyo (`obras`): la variante N usa
#   la obra N. Un autor sin `obras` aún no se genera (pendiente de rellenar).
# - `animo` (catalog/animos.yaml) decide la paleta; `escena` (opcional) fija la composición.
# - `motivo` sale de la biblioteca catalog/motivos.yaml (solo los `implementado: true`).
# - Gutenberg: `gutenberg.estado` es sin_verificar | verificado. Solo se marca
#   `verificado` con id real, comprobado con generator/verificar_gutenberg.py.
# - Los 6 autores de Romanticismo tras Poe/Byron y las obras de todos salvo Bécquer son borrador (de memoria, sin verificar).
# - `de` (opcional): obra de la que sale un tema, cuando la variante no es la obra entera.
# - Todas las obras y temas de todos los movimientos son borrador, escritos de memoria, sin fechas y sin verificar.
# - Regla de formato: la variante 01 de cada autor es JPG; el resto SVG.

