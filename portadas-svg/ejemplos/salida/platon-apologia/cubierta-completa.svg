<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="275.6mm" height="216mm" viewBox="93 0 275.6 216">
<title>Apología de Sócrates · Cubierta completa</title>
<rect x="0" y="0" width="461.6" height="216" fill="#f3ead7"/>
<rect x="241.6" y="11" width="119" height="194" fill="none" stroke="#7a2e1f" stroke-width="0.5"/>
<rect x="244.1" y="13.5" width="114" height="189" fill="none" stroke="#7a2e1f" stroke-width="0.2"/>
<text x="301.1" y="65.325" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="13" text-anchor="middle" fill="#2a1f17"><tspan x="301.1" dy="0">Apología de</tspan>
<tspan x="301.1" dy="17.55">Sócrates</tspan>
</text>
<text x="301.1" y="91.875" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="5" text-anchor="middle" fill="#2a1f17" font-style="italic"><tspan x="301.1" dy="0">Defensa ante el jurado de Atenas</tspan>
</text>
<line x1="285.1" y1="129" x2="297.1" y2="129" stroke="#7a2e1f" stroke-width="0.4"/>
<line x1="305.1" y1="129" x2="317.1" y2="129" stroke="#7a2e1f" stroke-width="0.4"/>
<polygon points="301.1,126.8 303.3,129 301.1,131.2 298.9,129" fill="#7a2e1f"/>
<text x="301.1" y="171" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="5.6" text-anchor="middle" fill="#2a1f17" letter-spacing="0.9"><tspan x="301.1" dy="0">PLATÓN</tspan>
</text>
<text x="301.1" y="195" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="3.2" text-anchor="middle" fill="#2a1f17"><tspan x="301.1" dy="0">Edición de ejemplo · Clásicos</tspan>
</text>
<line x1="109" y1="25" x2="121" y2="25" stroke="#7a2e1f" stroke-width="0.8"/>
<text x="109" y="40.36" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="4.2" text-anchor="start" fill="#2a1f17"><tspan x="109" dy="0">En el año 399 a. C., Sócrates comparece ante un</tspan>
<tspan x="109" dy="5.67">jurado de ciudadanos atenienses acusado de</tspan>
<tspan x="109" dy="5.67">impiedad y de corromper a la juventud.</tspan>
<tspan x="109" dy="5.67"> </tspan>
<tspan x="109" dy="5.67">Este texto recoge, según lo recuerda Platón, la</tspan>
<tspan x="109" dy="5.67">defensa que pronunció ante ellos y su negativa a</tspan>
<tspan x="109" dy="5.67">dejar de filosofar aunque con ello salvara la</tspan>
<tspan x="109" dy="5.67">vida.</tspan>
</text>
<text x="109" y="201" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="3.2" text-anchor="start" fill="#2a1f17"><tspan x="109" dy="0">Edición de ejemplo · Clásicos</tspan>
</text>
<rect x="170" y="175" width="42" height="26" fill="#ffffff"/>
<rect x="228" y="0" width="5.6" height="216" fill="#f3ead7"/>
<text transform="translate(229.624 108) rotate(90)" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="3.36" text-anchor="middle" fill="#2a1f17">Apología de Sócrates · Platón</text>
<text x="13" y="16.2" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="4" text-anchor="start" fill="#2a1f17"><tspan x="13" dy="0">Las preguntas que plantea Sócrates</tspan>
<tspan x="13" dy="5.4">siguen sin respuesta definitiva, y</tspan>
<tspan x="13" dy="5.4">por eso este diálogo se sigue</tspan>
<tspan x="13" dy="5.4">leyendo.</tspan>
</text>
<text x="378.6" y="16.2" font-family="Georgia, &apos;Times New Roman&apos;, serif" font-size="4" text-anchor="start" fill="#2a1f17"><tspan x="378.6" dy="0">Platón (c. 428–348 a. C.) fue</tspan>
<tspan x="378.6" dy="5.4">discípulo de Sócrates y fundó la</tspan>
<tspan x="378.6" dy="5.4">Academia en Atenas.</tspan>
</text>
</svg>
