<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación B - DVD Bouncing</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100vw;
            height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 30px;
        }

        .info {
            color: white;
            background: rgba(0, 0, 0, 0.3);
            padding: 20px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            font-size: 14px;
            max-width: 600px;
            text-align: center;
        }

        .info h2 {
            margin-bottom: 10px;
            font-size: 18px;
        }

        .golden-rectangle {
            width: 80vw;
            aspect-ratio: 1.618;
            max-width: 100%;
            background: rgba(255, 255, 255, 0.08);
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            position: relative;
            overflow: hidden;
            backdrop-filter: blur(10px);
            box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.1);
        }

        .ball {
            position: absolute;
            border-radius: 50%;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .ball-1 {
            width: 40px;
            height: 40px;
            background: radial-gradient(circle at 35% 35%, rgba(255, 200, 100, 0.8), rgba(255, 100, 100, 0.4) 40%, #ff4444 100%);
        }

        .ball-2 {
            width: 50px;
            height: 50px;
            background: radial-gradient(circle at 32% 32%, rgba(150, 255, 220, 0.9), rgba(100, 200, 200, 0.4) 45%, #00aa88 100%);
        }

        button {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid white;
            border-radius: 25px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: scale(1.05);
        }

        button:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="info">
        <h2>Animación B: Círculos Rebotadores (Estilo DVD)</h2>
        <p>Dos círculos con degradados radiales 3D rebotan dentro de un rectángulo de proporción áurea (1.618:1). Física realista de colisión con paredes.</p>
    </div>

    <div class="golden-rectangle" id="bouncingContainer">
        <div class="ball ball-1" id="ball1"></div>
        <div class="ball ball-2" id="ball2"></div>
    </div>

    <button onclick="toggleAnimation()">Pausar/Reanudar</button>

    <script>
        let isBouncingAnimating = true;
        const container = document.getElementById('bouncingContainer');
        const ball1 = document.getElementById('ball1');
        const ball2 = document.getElementById('ball2');

        class Ball {
            constructor(element, containerWidth, containerHeight, radius) {
                this.element = element;
                this.containerWidth = containerWidth;
                this.containerHeight = containerHeight;
                this.radius = radius;
                this.x = Math.random() * (containerWidth - radius * 2) + radius;
                this.y = Math.random() * (containerHeight - radius * 2) + radius;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.update();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x - this.radius <= 0 || this.x + this.radius >= this.containerWidth) {
                    this.vx = -this.vx;
                    this.x = Math.max(this.radius, Math.min(this.containerWidth - this.radius, this.x));
                }

                if (this.y - this.radius <= 0 || this.y + this.radius >= this.containerHeight) {
                    this.vy = -this.vy;
                    this.y = Math.max(this.radius, Math.min(this.containerHeight - this.radius, this.y));
                }

                this.element.style.left = (this.x - this.radius) + 'px';
                this.element.style.top = (this.y - this.radius) + 'px';
            }
        }

        const containerWidth = container.offsetWidth;
        const containerHeight = container.offsetHeight;

        const balls = [
            new Ball(ball1, containerWidth, containerHeight, 20),
            new Ball(ball2, containerWidth, containerHeight, 25)
        ];

        function animateBouncing() {
            if (isBouncingAnimating) {
                balls.forEach(ball => ball.update());
            }
            requestAnimationFrame(animateBouncing);
        }

        function toggleAnimation() {
            isBouncingAnimating = !isBouncingAnimating;
            document.querySelector('button').textContent = isBouncingAnimating ? 'Pausar/Reanudar' : 'Reanudar';
        }

        animateBouncing();

        window.addEventListener('resize', () => {
            const newWidth = container.offsetWidth;
            const newHeight = container.offsetHeight;
            balls.forEach(ball => {
                ball.containerWidth = newWidth;
                ball.containerHeight = newHeight;
            });
        });
    </script>
</body>
</html>
