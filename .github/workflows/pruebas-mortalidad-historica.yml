name: Pruebas mortalidad-historica

# Misma convencion que los demas proyectos del repo: solo cuando cambia este
# proyecto (o este archivo), en los pull requests y en master. Las pruebas no dependen de
# ninguna otra carpeta; solo el job manual `reproducir` lee Listado-paises/codigos_iso.csv y paises.csv.

on:
  push:
    branches: [master]
    paths:
      - "mortalidad-historica/**"
      - ".github/workflows/pruebas-mortalidad-historica.yml"
  pull_request:
    paths:
      - "mortalidad-historica/**"
      - ".github/workflows/pruebas-mortalidad-historica.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  mortalidad-historica:
    name: "mortalidad-historica: CSV válidos, glosario al día y pruebas"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Valida los ocho CSV de datos/ (columnas, valores permitidos, causas que existen, idiomas ISO 639-3,
      # que un dato «verificado» traiga su fuente) y falla si por-idioma/ o el «Resumen» del README no
      # coinciden con lo que genera el script.
      - name: Comprobar datos y salida generada
        working-directory: mortalidad-historica
        run: python3 generar_tabla.py --comprobar

      - name: Pruebas
        working-directory: mortalidad-historica
        run: python3 -m unittest -v pruebas

  # El port a PHP (php/src/Mortalidad.php) contra datos/vectores.json, que genera generar_tabla.py con
  # consultas.py, y PHPStan 2.1 en nivel max sobre php/src. Necesita las extensiones intl y mbstring.
  php:
    name: "mortalidad-historica: port a PHP ${{ matrix.php-version }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        php-version: ["8.1", "8.4"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: intl, mbstring
          coverage: none
          tools: phpstan:2.1

      - name: Pruebas del port a PHP
        working-directory: mortalidad-historica/php
        run: php pruebas/ejecutar.php

      - name: PHPStan
        working-directory: mortalidad-historica/php
        run: phpstan analyse --no-progress

  # El port a JavaScript (js/mortalidad.js, que también usa vista.html) contra los mismos vectores.
  js:
    name: "mortalidad-historica: port a JavaScript"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Pruebas
        working-directory: mortalidad-historica
        run: node --test 'js/*.test.js'

  # Solo al lanzarlo a mano (workflow_dispatch): baja las fuentes de la esperanza de vida fijadas por
  # commit, comprueba su SHA-256 contra fuentes.sha256, rehace datos/esperanza_vida.csv y falla si
  # cambia. Baja unos 5 MB y tarda menos de un minuto.
  reproducir:
    name: "mortalidad-historica: la esperanza de vida se rehace idéntica desde las fuentes"
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Bajar fuentes y rehacer los datos
        working-directory: mortalidad-historica
        run: python3 descargar_fuentes.py --destino "$RUNNER_TEMP/fuentes" --rehacer

      - name: Comprobar que nada cambió
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)"
