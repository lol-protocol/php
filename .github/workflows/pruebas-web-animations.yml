name: Pruebas web-animations

# Misma convencion que los demas proyectos del repo: solo cuando cambia este
# proyecto (o este archivo), en los pull requests y en master.

on:
  push:
    branches: [master]
    paths:
      - "web-animations/**"
      - ".github/workflows/pruebas-web-animations.yml"
  pull_request:
    paths:
      - "web-animations/**"
      - ".github/workflows/pruebas-web-animations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  web-animations:
    name: Web animations (smoke)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web-animations

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Open every animation in a browser
        run: npm test
