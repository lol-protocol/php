name: Pruebas

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  phpunit:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: defamatory-content-review
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: phpstan:2.1

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: ./vendor/bin/phpunit

      - name: Static analysis
        run: phpstan analyse --no-progress

      - name: Benchmark smoke run
        run: php bin/benchmark.php 2000

  phone-directory:
    name: phone-directory / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-directory
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phonedir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        env:
          PHONEDIR_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=phonedir_test;user=postgres;password=postgres
        run: ./vendor/bin/phpunit

      - name: Benchmark smoke run
        run: php bin/benchmark.php 2000

  phone-directory-ports:
    name: phone-directory / Python and Java ports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-directory/ports

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Python port tests
        working-directory: phone-directory/ports/python
        run: python -m unittest -v

      - name: Java port checks
        working-directory: phone-directory/ports/java
        run: |
          javac -encoding UTF-8 -d build *.java
          java -cp build PhoneDirectoryParserTest

  web-animations:
    name: Web animations (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-animations

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Open every animation in a browser
        run: npm test

  url-routing:
    name: url-routing / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: url-routing
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    # The suite runs every database test on SQLite and, via TEST_PG_DSN,
    # again on PostgreSQL, so SQL that only works on one engine fails CI.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: routing_test
          POSTGRES_PASSWORD: routing_test
          POSTGRES_DB: routing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U routing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_PG_DSN: pgsql:host=127.0.0.1;port=5432;dbname=routing_test
      TEST_PG_USER: routing_test
      TEST_PG_PASSWORD: routing_test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_sqlite, pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests (SQLite + PostgreSQL)
        run: ./vendor/bin/phpunit

      - name: Migrations apply cleanly on PostgreSQL (one database per site)
        env:
          PGPASSWORD: routing_test
          DB_DSN_GENEALOGY: pgsql:host=127.0.0.1;port=5432;dbname=genealogia
          DB_USER_GENEALOGY: routing_test
          DB_PASSWORD_GENEALOGY: routing_test
          DB_DSN_POS: pgsql:host=127.0.0.1;port=5432;dbname=pos
          DB_USER_POS: routing_test
          DB_PASSWORD_POS: routing_test
        run: |
          psql -h 127.0.0.1 -U routing_test -d routing_test -c 'CREATE DATABASE genealogia' -c 'CREATE DATABASE pos'
          php bin/migrate.php genealogy
          php bin/migrate.php pos
          php bin/migrate.php genealogy | grep -q 'sin migraciones pendientes'

  document-formats:
    name: document-formats (Node)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Run tests
        run: node --test 'document-formats/tests/*.test.js'

  document-formats-database:
    name: document-formats (MySQL import)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: formats
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_DSN: mysql:host=127.0.0.1;port=3306;dbname=formats;charset=utf8mb4
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Create the schema and import the CSV files
        run: php document-formats/import_database.php --create-schema

      - name: Import again, to check re-runs don't duplicate rows
        run: php document-formats/import_database.php

      - name: Check the database against the CSV files
        run: php document-formats/tests/database_check.php
