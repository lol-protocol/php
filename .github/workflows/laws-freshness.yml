name: Leyes - vigencia de los datos

# Weekly check that nothing in the datasets has gone stale: rows last checked over a year ago,
# upcoming changes whose date has passed, values changed after their source was checked.
# Warnings fail the job, and on the weekly run (or by hand) one open issue lists them and closes itself
# when none are left (.github/scripts/mantener-issue.sh).
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
  # Only master: without the branch filter, any branch that merged master re-ran this on push and its red
  # result showed up on unrelated PRs (the same problem #118 fixed in laws-links.yml and #179 in laws-modules.yml).
  push:
    branches: [master]
    paths:
      - '.github/workflows/laws-freshness.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  freshness:
    name: ${{ matrix.module }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module: [privacy-laws, copyright-laws]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `shell: bash` keeps pipefail, so `tee` does not hide the validator's exit status.
      - name: Validate and fail on warnings
        shell: bash
        run: npm run validate -- --fail-on-warnings 2>&1 | tee freshness.log

      - name: Keep the log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: freshness-${{ matrix.module }}
          path: ${{ matrix.module }}/freshness.log
          if-no-files-found: ignore

  issue:
    name: aviso de datos vencidos
    needs: freshness
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TITLE: Datos de leyes con revisión pendiente
      RESULT: ${{ needs.freshness.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout (only the scripts)
        uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts

      - name: Download the logs
        if: needs.freshness.result != 'success'
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: freshness-*
          path: logs

      # A run that failed before writing a log (npm ci, a runner loss) still opens the issue, with a link
      # to the run instead of the list.
      - name: Open, update or close the issue
        run: |
          if [ "$RESULT" = success ]; then
            bash .github/scripts/mantener-issue.sh ok "$TITLE" "" "Ya no hay datos vencidos ([corrida]($RUN_URL))."
            exit 0
          fi
          {
            echo "La revisión semanal de vigencia ([corrida]($RUN_URL)) encontró datos que revisar."
            echo
            for log in logs/*/freshness.log; do
              [ -f "$log" ] || continue
              module=$(basename "$(dirname "$log")" | sed 's/^freshness-//')
              avisos=$(grep -E '^(⚠|✖)' "$log" | sed 's/^/- /' || true)
              if [ -n "$avisos" ]; then
                printf '### %s\n\n%s\n\n' "$module" "$avisos"
              fi
            done
          } > body.md
          if ! grep -q '^###' body.md; then
            printf '\nNo hay registro con la lista (el job falló antes de escribirlo): abre la corrida.\n' >> body.md
          fi
          printf '\nUna fila revisada hace más de un año, un cambio previsto cuya fecha ya pasó o un valor cambiado después de revisar su fuente se arreglan en el CSV maestro y en `field_sources.csv` (ver `CONTRIBUTING.md` del módulo). La issue se cierra sola cuando la revisión semanal no encuentra nada.\n' >> body.md
          bash .github/scripts/mantener-issue.sh fallo "$TITLE" body.md
