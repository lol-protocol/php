<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>Constelación de Leo (esquema, no a escala)</title>
  <rect width="200" height="200" rx="12" fill="#0b1026"/>
  <g stroke="#8fa3d9" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="60" x2="60" y2="45"/>
    <line x1="60" y1="45" x2="85" y2="50"/>
    <line x1="85" y1="50" x2="95" y2="70"/>
    <line x1="95" y1="70" x2="80" y2="85"/>
    <line x1="80" y1="85" x2="140" y2="105"/>
    <line x1="140" y1="105" x2="175" y2="85"/>
    <line x1="140" y1="105" x2="120" y2="140"/>
    <line x1="120" y1="140" x2="80" y2="85"/>
  </g>
  <g fill="#ffffff">
