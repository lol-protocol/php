<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_descargar_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_descargar_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_descargar_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_descargar">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="55" rx="13" ry="3" fill="#000" opacity="0.15"/>

  <!-- Caja de descarga 2.5D -->
  <path d="M 20 26 L 24 24 L 44 24 L 48 26 L 47 42 L 21 42 Z"
        fill="url(#grad_descargar_1)" stroke="#4A4A4A" stroke-width="1.5" filter="url(#shadow_descargar)"/>

  <!-- Costado derecho -->
  <path d="M 44 24 L 48 26 L 47 42 L 43 40 Z"
        fill="#4A4A4A" opacity="0.3"/>

  <!-- Línea superior (tapa) -->
  <line x1="22" y1="26" x2="42" y2="26" stroke="#B0B0B0" stroke-width="1" opacity="0.5"/>

  <!-- Flecha de descarga dentro -->
  <!-- Línea vertical -->
  <line x1="32" y1="28" x2="32" y2="38" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
  <!-- Punta superior -->
  <polygon points="32,28 29,32 35,32" fill="#FFF"/>

  <!-- Indicador de actividad -->
  <line x1="26" y1="44" x2="38" y2="44" stroke="#6B6B6B" stroke-width="1.5" opacity="0.6"/>
  </svg>