<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_padre_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_padre_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_padre_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_padre">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="55" rx="14" ry="4" fill="#000" opacity="0.15"/>

  <!-- Profundidad base -->
  <rect x="20" y="28" width="24" height="18" fill="#1E40AF" opacity="0.2" rx="2"/>

  <!-- Cuerpo (torso) 2.5D -->
  <path d="M 22 30 L 28 28 L 42 28 L 48 30 L 46 46 L 24 46 Z"
        fill="url(#grad_padre_1)" stroke="#1E40AF" stroke-width="1.5" filter="url(#shadow_padre)"/>

  <!-- Costado derecho 2.5D -->
  <path d="M 42 28 L 48 30 L 46 46 L 40 44 Z"
        fill="#1E40AF" opacity="0.4"/>

  <!-- Brazo izquierdo -->
  <line x1="24" y1="33" x2="16" y2="35" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Brazo derecho -->
  <line x1="40" y1="33" x2="48" y2="35" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Cabeza -->
  <circle cx="32" cy="16" r="8" fill="url(#grad_padre_1)" stroke="#1E40AF" stroke-width="1.5"/>
  <circle cx="35" cy="14" r="7" fill="#60A5FA" opacity="0.3"/>

  <!-- Línea de conexión familia (vertical) -->
  <line x1="32" y1="46" x2="32" y2="54" stroke="#6B7280" stroke-width="1.5" stroke-dasharray="2,2" opacity="0.6"/>
  </svg>