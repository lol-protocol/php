name: Pruebas Listado-colores

# Misma convencion que los demas proyectos del repo: solo cuando cambia este
# proyecto (o este archivo), en los pull requests y en master.

on:
  push:
    branches: [master]
    paths:
      - "Listado-colores/**"
      - ".github/workflows/pruebas-listado-colores.yml"
  pull_request:
    paths:
      - "Listado-colores/**"
      - ".github/workflows/pruebas-listado-colores.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  listado-colores:
    name: "Listado-colores: CSV válidos y tabla del README al día"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Valida los nueve CSV y CHANGELOG.md, y falla si algun archivo generado
      # (la tabla de README.md, nombres-completos.csv, colores-por-idioma.md, por-idioma/,
      # referencias.md, ambiguedad.md, auditoria-nombres.md, categorias.md,
      # cobertura.md, revisiones.md, visor-revision.html o exportes/, con los patrones
      # de spaCy y su manifiesto) no coincide con lo que generan; construye
      # ademas una base SQLite en memoria y comprueba que los recuentos coincidan.
      # Tarda entre 13 y 20 s porque recalcula el color CSS mas cercano de cada nombre.
      - name: Comprobar datos y tabla
        working-directory: Listado-colores
        run: python3 generar-tabla.py --comprobar

      # Pruebas del generador: cada regla de validacion rota a proposito sobre una
      # copia de los CSV, y main() de punta a punta en una carpeta temporal con
      # nombres-completos.csv reducido. Entre 8 y 16 s; no escribe en el proyecto.
      - name: Pruebas del generador
        working-directory: Listado-colores
        run: python3 -m unittest -v pruebas

  # Lo mismo en otras versiones de Python y en macOS. El README dice que el desempate del
  # color CSS mas cercano redondea a 9 decimales para no depender de la coma flotante entre
  # plataformas: --comprobar recalcula las 31.935 distancias y las compara con el archivo
  # guardado, asi que un resultado distinto en macOS (arm64, otra libreria matematica) o en
  # otra version de Python haria fallar este job. El job de arriba (Python del runner) se
  # queda como esta. Runners fijados, como en el resto del repo.
  listado-colores-matriz:
    name: "Listado-colores / Python ${{ matrix.python-version }} en ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: macos-15
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Comprobar datos y tabla
        working-directory: Listado-colores
        run: python3 generar-tabla.py --comprobar

      - name: Pruebas del generador
        working-directory: Listado-colores
        run: python3 -m unittest -v pruebas
