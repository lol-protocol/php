<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>Constelación de Sagitario (esquema, no a escala)</title>
  <rect width="200" height="200" rx="12" fill="#0b1026"/>
  <g stroke="#8fa3d9" stroke-width="1.5" stroke-linecap="round">
    <line x1="60" y1="90" x2="110" y2="90"/>
    <line x1="110" y1="90" x2="110" y2="135"/>
    <line x1="110" y1="135" x2="60" y2="135"/>
    <line x1="60" y1="135" x2="60" y2="90"/>
    <line x1="60" y1="90" x2="40" y2="70"/>
    <line x1="110" y1="90" x2="85" y2="60"/>
    <line x1="85" y1="60" x2="120" y2="55"/>
    <line x1="110" y1="135" x2="145" y2="105"/>
  </g>
  <g fill="#ffffff">
    <circle cx="60" cy="90" r="2.8"/>
    <circle cx="110" cy="90" r="2.8"/>
    <circle cx="110" cy="135" r="2.8"/>
    <circle cx="60" cy="135" r="2.8"/>
    <circle cx="40" cy="70" r="2.8"/>
    <circle cx="145" cy="105" r="2.8"/>
    <circle cx="85" cy="60" r="2.8"/>
    <circle cx="120" cy="55" r="2.8"/>
  </g>
  <text x="100" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c9d3f0">Sagitario</text>
</svg>
