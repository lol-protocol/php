<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>Constelación de Cáncer (esquema, no a escala)</title>
  <rect width="200" height="200" rx="12" fill="#0b1026"/>
  <g stroke="#8fa3d9" stroke-width="1.5" stroke-linecap="round">
    <line x1="100" y1="40" x2="100" y2="80"/>
    <line x1="60" y1="100" x2="100" y2="80"/>
    <line x1="100" y1="80" x2="140" y2="100"/>
    <line x1="100" y1="80" x2="100" y2="140"/>
  </g>
  <g fill="#ffffff">
    <circle cx="100" cy="40" r="2.8"/>
    <circle cx="60" cy="100" r="2.8"/>
    <circle cx="100" cy="80" r="2.8"/>
    <circle cx="140" cy="100" r="2.8"/>
    <circle cx="100" cy="140" r="2.8"/>
  </g>
  <text x="100" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c9d3f0">Cáncer</text>
</svg>
