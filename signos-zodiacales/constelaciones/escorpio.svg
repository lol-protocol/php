  <title>Constelación de Escorpio (esquema, no a escala)</title>
  <rect width="200" height="200" rx="12" fill="#0b1026"/>
  <g stroke="#8fa3d9" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="40" x2="55" y2="45"/>
    <line x1="55" y1="45" x2="75" y2="65"/>
    <line x1="75" y1="65" x2="85" y2="95"/>
    <line x1="85" y1="95" x2="110" y2="110"/>
