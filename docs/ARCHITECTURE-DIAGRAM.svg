<svg viewBox="0 0 1200 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .box { fill: #e3f2fd; stroke: #1976d2; stroke-width: 2; }
      .box-active { fill: #c8e6c9; stroke: #388e3c; stroke-width: 2; }
      .box-server { fill: #fff3e0; stroke: #f57c00; stroke-width: 2; }
      .text-title { font-size: 14px; font-weight: bold; fill: #1976d2; }
      .text-label { font-size: 12px; fill: #333; }
      .text-small { font-size: 11px; fill: #666; }
      .arrow { stroke: #666; stroke-width: 2; fill: none; marker-end: url(#arrowhead); }
      .arrow-strong { stroke: #1976d2; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead-blue); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#666"/>
    </marker>
    <marker id="arrowhead-blue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#1976d2"/>
    </marker>
  </defs>

  <!-- Título -->
  <text x="600" y="30" style="font-size: 24px; font-weight: bold; text-anchor: middle; fill: #1565c0;">
    Arquitectura VPS Initech - 158.69.222.245
  </text>
  <text x="600" y="50" style="font-size: 12px; text-anchor: middle; fill: #666;">
    Ubuntu 24 LTS | Nginx | PHP 8.3 | Python 3.12 | PostgreSQL 16 | OVHCloud (Canadá)
  </text>

  <!-- LAYER 1: Internet / DNS -->
  <rect x="50" y="80" width="1100" height="80" class="box" rx="5"/>
  <text x="600" y="105" style="font-size: 14px; font-weight: bold; text-anchor: middle; fill: #1976d2;">
    INTERNET / DNS (Cloudflare)
  </text>

  <!-- Dominios -->
  <g id="domains">
    <rect x="80" y="120" width="100" height="30" class="box-active" rx="3"/>
    <text x="130" y="140" style="font-size: 11px; text-anchor: middle; fill: #333;">conce.com</text>

    <rect x="200" y="120" width="100" height="30" class="box-active" rx="3"/>
    <text x="250" y="140" style="font-size: 11px; text-anchor: middle; fill: #333;">initech.cl</text>

    <rect x="320" y="120" width="140" height="30" class="box" rx="3"/>
    <text x="390" y="140" style="font-size: 11px; text-anchor: middle; fill: #333;">contrastocolor.ink</text>

    <rect x="480" y="120" width="100" height="30" class="box" rx="3"/>
    <text x="530" y="140" style="font-size: 11px; text-anchor: middle; fill: #333;">wikipedia.cl</text>

    <rect x="600" y="120" width="100" height="30" class="box" rx="3"/>
    <text x="650" y="140" style="font-size: 11px; text-anchor: middle; fill: #333;">otros...</text>
  </g>

  <!-- Flechas DNS a VPS -->
  <polyline points="130,150 130,190 400,190 400,220" class="arrow-strong"/>
  <polyline points="250,150 250,180 400,180 400,220" class="arrow-strong"/>
  <polyline points="390,150 390,210 400,210 400,220" class="arrow-strong"/>
  <polyline points="530,150 530,200 400,200 400,220" class="arrow-strong"/>

  <!-- LAYER 2: VPS -->
  <rect x="200" y="220" width="400" height="80" class="box-server" rx="5" stroke-width="3"/>
  <text x="400" y="245" style="font-size: 14px; font-weight: bold; text-anchor: middle; fill: #f57c00;">
    VPS - 158.69.222.245 (OVHCloud)
  </text>
  <text x="400" y="265" style="font-size: 11px; text-anchor: middle; fill: #666;">
    Ubuntu 24.04 LTS | 2-4 CPU | 4-8 GB RAM | 50+ GB Disco
  </text>
  <text x="400" y="285" style="font-size: 11px; text-anchor: middle; fill: #666;">
    Puertos: 22 (SSH), 80 (HTTP), 443 (HTTPS)
  </text>

  <!-- LAYER 3: Nginx -->
  <rect x="150" y="340" width="500" height="70" class="box-server" rx="5"/>
  <text x="400" y="365" style="font-size: 13px; font-weight: bold; text-anchor: middle; fill: #f57c00;">
    Nginx 1.26+ (Reverse Proxy / Load Balancer)
  </text>
  <text x="400" y="385" style="font-size: 10px; text-anchor: middle; fill: #666;">
    Virtual Hosts | Compresión GZIP | Cache HTTP | SSL Termination
  </text>
  <text x="400" y="400" style="font-size: 10px; text-anchor: middle; fill: #666;">
    Logs: /var/log/nginx/[dominio]/
  </text>

  <!-- Flechas VPS a Nginx -->
  <polyline points="400,300 400,340" class="arrow-strong"/>

  <!-- LAYER 4: Aplicaciones -->
  <g id="apps">
    <!-- Landing Pages -->
    <rect x="50" y="450" width="140" height="80" class="box" rx="5"/>
    <text x="120" y="475" style="font-size: 12px; font-weight: bold; text-anchor: middle; fill: #1976d2;">
      Landing Pages
    </text>
    <text x="120" y="495" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • conce.com
    </text>
    <text x="120" y="510" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • initech.cl
    </text>
    <text x="120" y="525" style="font-size: 10px; text-anchor: middle; fill: #666;">
      HTML/CSS/SVG
    </text>

    <!-- PHP Apps -->
    <rect x="220" y="450" width="140" height="80" class="box" rx="5"/>
    <text x="290" y="475" style="font-size: 12px; font-weight: bold; text-anchor: middle; fill: #1976d2;">
      PHP 8.3 (FPM)
    </text>
    <text x="290" y="495" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • wikipedia.cl
    </text>
    <text x="290" y="510" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • APIs dinámicas
    </text>
    <text x="290" y="525" style="font-size: 10px; text-anchor: middle; fill: #666;">
      PostgreSQL
    </text>

    <!-- Python Apps -->
    <rect x="390" y="450" width="140" height="80" class="box" rx="5"/>
    <text x="460" y="475" style="font-size: 12px; font-weight: bold; text-anchor: middle; fill: #1976d2;">
      Python 3.12
    </text>
    <text x="460" y="495" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • contrastocolor.ink
    </text>
    <text x="460" y="510" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • Flask/FastAPI
    </text>
    <text x="460" y="525" style="font-size: 10px; text-anchor: middle; fill: #666;">
      Gunicorn
    </text>

    <!-- Java (Future) -->
    <rect x="560" y="450" width="140" height="80" class="box" rx="5" opacity="0.5"/>
    <text x="630" y="475" style="font-size: 12px; font-weight: bold; text-anchor: middle; fill: #1976d2; opacity: 0.7;">
      Java 21 (Futuro)
    </text>
    <text x="630" y="495" style="font-size: 10px; text-anchor: middle; fill: #666; opacity: 0.7;">
      • Aplicaciones
    </text>
    <text x="630" y="510" style="font-size: 10px; text-anchor: middle; fill: #666; opacity: 0.7;">
      empresariales
    </text>
    <text x="630" y="525" style="font-size: 10px; text-anchor: middle; fill: #666; opacity: 0.7;">
      (próximos)
    </text>
  </g>

  <!-- Flechas Nginx a Apps -->
  <polyline points="200,410 120,450" class="arrow"/>
  <polyline points="350,410 290,450" class="arrow"/>
  <polyline points="450,410 460,450" class="arrow"/>
  <polyline points="550,410 630,450" class="arrow" opacity="0.5"/>

  <!-- LAYER 5: Base de Datos -->
  <rect x="150" y="600" width="500" height="120" class="box-active" rx="5" stroke-width="3"/>
  <text x="400" y="630" style="font-size: 14px; font-weight: bold; text-anchor: middle; fill: #388e3c;">
    PostgreSQL 16 (Base de Datos Centralizada)
  </text>
  <text x="400" y="655" style="font-size: 11px; text-anchor: middle; fill: #666;">
    • wikipedia.cl (datos de wiki)
  </text>
  <text x="400" y="673" style="font-size: 11px; text-anchor: middle; fill: #666;">
    • contrastocolor.ink (paletas, historiales)
  </text>
  <text x="400" y="691" style="font-size: 11px; text-anchor: middle; fill: #666;">
    • Futuro: usuarios, transacciones, etc.
  </text>
  <text x="400" y="709" style="font-size: 10px; text-anchor: middle; fill: #666;">
    Config: /etc/postgresql/16/main/ | Data: /var/lib/postgresql/
  </text>

  <!-- Flechas Apps a BD -->
  <polyline points="290,530 350,600" class="arrow-strong"/>
  <polyline points="460,530 450,600" class="arrow-strong"/>

  <!-- LAYER 6: Seguridad / Certificados -->
  <g id="security">
    <rect x="50" y="780" width="200" height="90" class="box" rx="5"/>
    <text x="150" y="805" style="font-size: 12px; font-weight: bold; text-anchor: middle; fill: #1976d2;">
      🔐 Let's Encrypt / SSL
    </text>
    <text x="150" y="825" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • Certificados automáticos
    </text>
    <text x="150" y="840" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • Renovación automática
    </text>
    <text x="150" y="855" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • HTTPS en todos los dominios
    </text>

    <rect x="280" y="780" width="200" height="90" class="box" rx="5"/>
    <text x="380" y="805" style="font-size: 12px; font-weight: bold; text-anchor: middle; fill: #1976d2;">
      🛡️ Firewall / UFW
    </text>
    <text x="380" y="825" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • Puertos: 22, 80, 443
    </text>
    <text x="380" y="840" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • SSH key-based auth
    </text>
    <text x="380" y="855" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • Fail2Ban (próximos)
    </text>

    <rect x="510" y="780" width="200" height="90" class="box" rx="5"/>
    <text x="610" y="805" style="font-size: 12px; font-weight: bold; text-anchor: middle; fill: #1976d2;">
      📊 Monitoreo / Logs
    </text>
    <text x="610" y="825" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • Nginx access/error logs
    </text>
    <text x="610" y="840" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • Syslog del sistema
    </text>
    <text x="610" y="855" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • Alertas (próximas)
    </text>

    <rect x="740" y="780" width="200" height="90" class="box" rx="5"/>
    <text x="840" y="805" style="font-size: 12px; font-weight: bold; text-anchor: middle; fill: #1976d2;">
      💾 Backups
    </text>
    <text x="840" y="825" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • BD diarios
    </text>
    <text x="840" y="840" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • Archivos semanales
    </text>
    <text x="840" y="855" style="font-size: 10px; text-anchor: middle; fill: #666;">
      • Almacenamiento S3 (futuro)
    </text>
  </g>

  <!-- Leyenda -->
  <g id="legend" style="font-size: 10px;">
    <text x="50" y="880" style="font-weight: bold; fill: #333;">Leyenda:</text>
    <rect x="150" y="870" width="12" height="12" class="box-active"/>
    <text x="168" y="880" fill="#333;">Activo</text>

    <rect x="250" y="870" width="12" height="12" class="box"/>
    <text x="268" y="880" fill="#333;">Configurado</text>

    <rect x="380" y="870" width="12" height="12" class="box" opacity="0.5"/>
    <text x="398" y="880" fill="#333;">Futuro</text>

    <rect x="480" y="870" width="12" height="12" class="box-server"/>
    <text x="498" y="880" fill="#333;">Sistema</text>
  </g>
</svg>
