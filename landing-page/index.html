<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Initech</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .svg-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 1000px;
        }

        svg {
            width: 100%;
            max-width: 520px;
            height: auto;
            filter: drop-shadow(0 20px 40px rgba(0, 0, 0, 0.3));
        }

        .cube {
            animation: float 6s ease-in-out infinite;
        }

        .cube:nth-child(2) {
            animation-delay: 0.2s;
        }

        .cube:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-20px);
            }
        }

        /* Sin animacion para quien la desactiva en su sistema (mareo, bateria) */
        @media (prefers-reduced-motion: reduce) {
            .cube {
                animation: none;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="svg-container">
            <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Figuras geométricas isométricas de colores">
                <!-- Cubo 1 -->
                <g class="cube">
                    <!-- Cara frontal -->
                    <polygon points="50,100 150,50 150,150 50,200" fill="#FF6B6B" opacity="0.9"/>
                    <!-- Cara superior -->
                    <polygon points="150,50 250,50 200,20 100,20" fill="#FFD93D" opacity="0.95"/>
                    <!-- Cara lateral -->
                    <polygon points="150,50 200,20 200,120 150,150" fill="#4ECDC4" opacity="0.85"/>
                </g>

                <!-- Cubo 2 -->
                <g class="cube">
                    <!-- Cara frontal -->
                    <polygon points="200,150 300,100 300,200 200,250" fill="#A8E6CF" opacity="0.9"/>
                    <!-- Cara superior -->
                    <polygon points="300,100 400,100 350,70 250,70" fill="#FF8B94" opacity="0.95"/>
                    <!-- Cara lateral -->
                    <polygon points="300,100 350,70 350,170 300,200" fill="#FFD3B6" opacity="0.85"/>
                </g>

                <!-- Cubo 3 -->
                <g class="cube">
                    <!-- Cara frontal -->
                    <polygon points="125,220 225,170 225,270 125,320" fill="#FFAAA5" opacity="0.9"/>
                    <!-- Cara superior -->
                    <polygon points="225,170 325,170 275,140 175,140" fill="#FF8B94" opacity="0.95"/>
                    <!-- Cara lateral -->
                    <polygon points="225,170 275,140 275,240 225,270" fill="#74B9FF" opacity="0.85"/>
                </g>
            </svg>
        </div>
    </div>
</body>
</html>
