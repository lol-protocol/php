name: Pruebas Listado-colores

# Misma convencion que los demas proyectos del repo: solo cuando cambia este
# proyecto (o este archivo), en los pull requests y en master.

on:
  push:
    branches: [master]
    paths:
      - "Listado-colores/**"
      - ".github/workflows/pruebas-listado-colores.yml"
  pull_request:
    paths:
      - "Listado-colores/**"
      - ".github/workflows/pruebas-listado-colores.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  listado-colores:
    name: "Listado-colores: CSV válidos y tabla del README al día"
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # Valida los siete CSV de datos y falla si algun archivo generado (la tabla
      # de README.md, nombres-completos.csv, colores-por-idioma.md, por-idioma/,
      # referencias.md o exportes/) no coincide con lo que generan; construye
      # ademas una base SQLite en memoria y comprueba que los recuentos coincidan.
      # Tarda unos 25 s porque recalcula el color CSS mas cercano de cada nombre.
      - name: Comprobar datos y tabla
        working-directory: Listado-colores
        run: python3 generar-tabla.py --comprobar
