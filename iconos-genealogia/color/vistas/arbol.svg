<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_arbol_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_arbol_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_arbol_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_arbol">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <!-- ============ SHADOW: BASE SHADOW ============ -->
  <ellipse cx="32" cy="55" rx="14" ry="3" fill="#000" opacity="0.15"/>

  <!-- Tronco 2.5D -->
  <path d="M 28 40 L 30 38 L 36 38 L 38 40 L 37 52 L 29 52 Z"
        fill="#8B5A2B" stroke="#5C3317" stroke-width="1" filter="url(#shadow_arbol)"/>
  <path d="M 36 38 L 38 40 L 37 52 L 35 50 Z"

  <!-- ============ DEPTH: 2.5D EFFECTS ============ -->
        fill="#5C3317" opacity="0.4"/>

  <!-- Follaje superior (triángulo) 2.5D -->
  <path d="M 32 8 L 22 28 L 42 28 Z"
        fill="url(#grad_arbol_3)" stroke="#047857" stroke-width="1.5" filter="url(#shadow_arbol)"/>

  <!-- ============ BODY: MAIN FIGURE ============ -->
  <!-- Costado derecho del follaje -->
  <path d="M 42 28 L 46 32 L 36 38 L 32 34 Z"
        fill="#047857" opacity="0.3"/>

  <!-- Follaje medio -->
  <path d="M 32 24 L 19 36 L 45 36 Z"
        fill="url(#grad_arbol_3)" stroke="#047857" stroke-width="1.5" opacity="0.8"/>

  <!-- Raíces sutiles -->
  <line x1="28" y1="52" x2="24" y2="56" stroke="#6B7280" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  <line x1="36" y1="52" x2="40" y2="56" stroke="#6B7280" stroke-width="1.5" opacity="0.5" stroke-linecap="round"/>
  </svg>