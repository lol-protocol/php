<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_hijo_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_hijo_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_hijo_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_hijo">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="55" rx="11" ry="3" fill="#000" opacity="0.15"/>

  <!-- Cuerpo pequeño (niño) -->
  <path d="M 25 32 L 29 31 L 39 31 L 43 32 L 42 44 L 26 44 Z"
        fill="url(#grad_hijo_1)" stroke="#4A4A4A" stroke-width="1.5" filter="url(#shadow_hijo)"/>

  <!-- Costado derecho -->
  <path d="M 39 31 L 43 32 L 42 44 L 38 42 Z"
        fill="#4A4A4A" opacity="0.3"/>

  <!-- Brazos cortos -->
  <line x1="26" y1="34" x2="18" y2="35" stroke="#8B8B8B" stroke-width="2" stroke-linecap="round"/>
  <line x1="38" y1="34" x2="46" y2="35" stroke="#8B8B8B" stroke-width="2" stroke-linecap="round"/>

  <!-- Cabeza (más grande proporcionalmente) -->
  <circle cx="32" cy="16" r="7" fill="url(#grad_hijo_1)" stroke="#4A4A4A" stroke-width="1.5"/>
  <circle cx="34" cy="14" r="6" fill="#B0B0B0" opacity="0.3"/>
  </svg>