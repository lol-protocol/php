<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>Constelación de Capricornio (esquema, no a escala)</title>
  <rect width="200" height="200" rx="12" fill="#0b1026"/>
  <g stroke="#8fa3d9" stroke-width="1.5" stroke-linecap="round">
    <line x1="30" y1="60" x2="70" y2="50"/>
    <line x1="70" y1="50" x2="100" y2="80"/>
    <line x1="100" y1="80" x2="130" y2="70"/>
    <line x1="130" y1="70" x2="160" y2="100"/>
    <line x1="160" y1="100" x2="150" y2="140"/>
    <line x1="150" y1="140" x2="110" y2="150"/>
    <line x1="110" y1="150" x2="70" y2="120"/>
    <line x1="70" y1="120" x2="100" y2="110"/>
    <line x1="100" y1="110" x2="100" y2="80"/>
  </g>
  <g fill="#ffffff">
    <circle cx="30" cy="60" r="2.8"/>
    <circle cx="70" cy="50" r="2.8"/>
    <circle cx="100" cy="80" r="2.8"/>
    <circle cx="130" cy="70" r="2.8"/>
    <circle cx="160" cy="100" r="2.8"/>
    <circle cx="150" cy="140" r="2.8"/>
    <circle cx="110" cy="150" r="2.8"/>
    <circle cx="70" cy="120" r="2.8"/>
    <circle cx="100" cy="110" r="2.8"/>
  </g>
  <text x="100" y="192" text-anchor="middle" font-family="sans-serif" font-size="11" fill="#c9d3f0">Capricornio</text>
</svg>
