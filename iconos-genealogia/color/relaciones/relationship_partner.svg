<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_pareja_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_pareja_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_pareja_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_pareja">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <!-- ============ SHADOW: BASE SHADOW ============ -->
  <ellipse cx="32" cy="55" rx="16" ry="4" fill="#000" opacity="0.15"/>

  <!-- Hombre izquierda -->
  <path d="M 16 32 L 20 30 L 28 30 L 32 32 L 31 44 L 17 44 Z"
        fill="url(#grad_pareja_1)" stroke="#1E40AF" stroke-width="1.5" filter="url(#shadow_pareja)"/>
  <circle cx="24" cy="16" r="7" fill="url(#grad_pareja_1)" stroke="#1E40AF" stroke-width="1.5"/>

  <!-- Mujer derecha -->
  <path d="M 32 34 L 36 32 L 44 32 L 48 34 L 47 44 L 33 44 Z"
        fill="url(#grad_pareja_2)" stroke="#BE185D" stroke-width="1.5" filter="url(#shadow_pareja)"/>
  <circle cx="40" cy="18" r="7" fill="url(#grad_pareja_2)" stroke="#BE185D" stroke-width="1.5"/>

  <!-- Línea de conexión (corazón) -->
  <path d="M 30 40 L 34 40" stroke="#EC4899" stroke-width="2"/>
  <circle cx="32" cy="40" r="1.5" fill="#EC4899"/>
  </svg>