<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_editar_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_editar_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_editar_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_editar">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="55" rx="12" ry="3" fill="#000" opacity="0.15"/>

  <!-- Lápiz 2.5D -->
  <!-- Cuerpo del lápiz -->
  <path d="M 18 48 L 20 48 L 45 18 L 43 18 Z"
        fill="url(#grad_editar_3)" stroke="#4A4A4A" stroke-width="1" filter="url(#shadow_editar)"/>

  <!-- Costado del lápiz (profundidad) -->
  <path d="M 43 18 L 45 18 L 46 19 L 44 19 Z"
        fill="#4A4A4A" opacity="0.3"/>
  <path d="M 20 48 L 22 49 L 45 19 L 43 18 Z"
        fill="#4A4A4A" opacity="0.2"/>

  <!-- Punta del lápiz -->
  <polygon points="45,18 48,20 43,23" fill="#000" opacity="0.5"/>
  <polygon points="44,18 46,20 43,22" fill="#FFD700"/>

  <!-- Goma de borrar -->
  <rect x="17" y="46" width="4" height="4" fill="#FFB6C1" stroke="#4A4A4A" stroke-width="0.5" rx="0.5"/>

  <!-- Brillo en el lápiz -->
  <line x1="20" y1="44" x2="42" y2="20" stroke="#B0B0B0" stroke-width="1" opacity="0.4"/>
  </svg>