<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow_generaciones">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
    <linearGradient id="grad_generaciones" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#B0B0B0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B8B8B;stop-opacity:1" />
    </linearGradient>
  </defs>

  <ellipse cx="32" cy="55" rx="13" ry="3" fill="#000" opacity="0.15"/>
  <!-- Generación 1 (abuelos) -->
  <circle cx="18" cy="14" r="4" fill="#8B8B8B" stroke="#4A4A4A" stroke-width="1"/>
  <circle cx="46" cy="14" r="4" fill="#8B8B8B" stroke="#4A4A4A" stroke-width="1"/>
  <!-- Generación 2 (padres) -->
  <circle cx="24" cy="28" r="5" fill="#B0B0B0" stroke="#4A4A4A" stroke-width="1.5"/>
  <circle cx="40" cy="28" r="5" fill="#B0B0B0" stroke="#4A4A4A" stroke-width="1.5"/>
  <!-- Generación 3 (hijos) -->
  <circle cx="32" cy="44" r="6" fill="#8B8B8B" stroke="#4A4A4A" stroke-width="1.5"/>
  <!-- Líneas conectoras -->
  <line x1="18" y1="18" x2="24" y2="23" stroke="#6B6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="46" y1="18" x2="40" y2="23" stroke="#6B6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="24" y1="33" x2="32" y2="38" stroke="#6B6B6B" stroke-width="1" opacity="0.5"/>
  <line x1="40" y1="33" x2="32" y2="38" stroke="#6B6B6B" stroke-width="1" opacity="0.5"/>
  </svg>