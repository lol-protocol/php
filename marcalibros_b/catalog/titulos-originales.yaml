# Títulos en el idioma original de las obras del catálogo, para que el lector reconozca el libro que se abre
# (Gutenberg titula en el idioma del texto: «The Raven», no «El cuervo»). Es opcional y parcial: una obra
# sin entrada se reconoce solo por su título en español y por su autor. Escritos de memoria, sin verificar.
# Clave: id del autor → id de la obra (como en taxonomia.yaml) → lista de títulos.
version: '0.1'
