name: Leyes - vigencia de los datos

# Weekly check that nothing in the datasets has gone stale: rows last checked over a year ago,
# upcoming changes whose date has passed, values changed after their source was checked.
# Warnings fail the job (GitHub then notifies); the run summary lists them.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/laws-freshness.yml'

permissions:
  contents: read

jobs:
  freshness:
    name: ${{ matrix.module }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module: [privacy-laws, copyright-laws]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate and fail on warnings
        run: npm run validate -- --fail-on-warnings
