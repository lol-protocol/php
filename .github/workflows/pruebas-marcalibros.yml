name: Pruebas marcalibros

on:
  push:
    branches: [master]
    paths:
      - "marcalibros-plataforma-pos-brand-identity/**"
      - "defamatory-content-review/**"
      - ".github/workflows/pruebas-marcalibros.yml"
  pull_request:
    paths:
      - "marcalibros-plataforma-pos-brand-identity/**"
      - "defamatory-content-review/**"
      - ".github/workflows/pruebas-marcalibros.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  php:
    name: ${{ matrix.proyecto }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        proyecto: [php, app]
        php: ["8.1", "8.3"]
    defaults:
      run:
        working-directory: marcalibros-plataforma-pos-brand-identity/${{ matrix.proyecto }}

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, mbstring, exif
          tools: composer:v2

      # app/ enlaza ../php por ruta, así que su lock depende del módulo.
      - run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHPUnit
        run: ./vendor/bin/phpunit

      - name: PHPStan (nivel 6)
        run: ./vendor/bin/phpstan analyse --no-progress

  catalogo:
    name: El generador no cambia el catálogo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marcalibros-plataforma-pos-brand-identity

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r generator/requirements.txt

      - run: python3 generator/generar_marcalibros.py

      # Solo SVG y manifiesto: los JPG dependen de la versión de Pillow del ejecutor.
      # status (no diff) para detectar también archivos nuevos sin versionar.
      - name: Sin cambios en los SVG ni en el manifiesto
        run: |
          cambios="$(git status --porcelain -- catalog/svg catalog/manifest.json)"
          if [ -n "$cambios" ]; then
            echo "$cambios"
            exit 1
          fi

  navegador:
    name: Navegador (Playwright)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: marcalibros-plataforma-pos-brand-identity/app

    steps:
      - uses: actions/checkout@v5

      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: fileinfo, gd, mbstring, exif
          tools: composer:v2

      - run: composer install --no-interaction --prefer-dist --no-progress --no-dev

      - name: Instalar Playwright y Chromium
        run: |
          npm install -g playwright@1.56.1
          playwright install --with-deps chromium

      - name: Levantar la aplicación
        run: |
          MARCALIBROS_STORAGE="$RUNNER_TEMP/marcalibros" php -S 127.0.0.1:8080 -t public public/index.php > "$RUNNER_TEMP/app.log" 2>&1 &
          for _ in $(seq 1 30); do
            curl -sf -o /dev/null --max-time 2 http://127.0.0.1:8080/ && exit 0
            sleep 1
          done
          echo "La aplicación no levantó a tiempo"
          exit 1

      - name: Pruebas de navegador
        run: NODE_PATH="$(npm root -g)" node e2e/navegador.mjs

      - name: Registro del servidor
        if: failure()
        run: tail -n 50 "$RUNNER_TEMP/app.log" || true
