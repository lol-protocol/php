<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img">
  <title>Constelación de Aries (esquema, no a escala)</title>
  <rect width="200" height="200" rx="12" fill="#0b1026"/>
  <g stroke="#8fa3d9" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="120" x2="65" y2="100"/>
    <line x1="65" y1="100" x2="95" y2="85"/>
    <line x1="95" y1="85" x2="120" y2="70"/>
    <line x1="40" y1="120" x2="70" y2="130"/>
    <line x1="70" y1="130" x2="105" y2="125"/>
    <line x1="105" y1="125" x2="140" y2="125"/>
    <line x1="140" y1="125" x2="170" y2="110"/>
    <line x1="65" y1="100" x2="105" y2="125"/>
  </g>
  <g fill="#ffffff">
