<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animación Z - Zoom Infinito</title>
    <link rel="stylesheet" href="../../helpers/common.css">
    <link rel="stylesheet" href="animacion-z.css">
</head>
<body class="fullscreen-container">
    <div class="info-panel">
        <h2>Z) Zoom Infinito</h2>
        <p>Efecto de zoom infinito con capas anidadas.</p>
    </div>

    <div class="zoom-container">
        <div class="zoom-layer layer-0"></div>
        <div class="zoom-layer layer-1"></div>
        <div class="zoom-layer layer-2"></div>
        <div class="zoom-layer layer-3"></div>
        <div class="zoom-layer layer-4"></div>
    </div>

    <button class="control-btn" onclick="toggle.toggle()">Pausar/Reanudar</button>
    <script src="../../helpers/common.js"></script>
    <script src="animacion-z.js"></script>
</body>
</html>
