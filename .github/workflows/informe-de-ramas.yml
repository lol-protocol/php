name: Informe de ramas

# Cada lunes lista las ramas remotas vacías o ya fusionadas, en el resumen de la corrida.
# Solo informa: no borra nada (ver .github/scripts/informe-de-ramas.sh). También corre cuando cambia
# el propio workflow o el script, para ver su resultado en el PR.
on:
  schedule:
    - cron: '41 6 * * 1'
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '.github/workflows/informe-de-ramas.yml'
      - '.github/scripts/informe-de-ramas.sh'
  pull_request:
    paths:
      - '.github/workflows/informe-de-ramas.yml'
      - '.github/scripts/informe-de-ramas.sh'

permissions:
  contents: read
  pull-requests: read

jobs:
  ramas:
    name: ramas vacías o fusionadas
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # hacen falta todas las ramas y su historia

      - name: Listar las ramas que ya no aportan nada
        run: bash .github/scripts/informe-de-ramas.sh
