name: Leyes (privacidad y copyright)

on:
  # Solo master: sin el filtro de rama, cualquier rama que fusionara master (y trajera con eso
  # un cambio en estas carpetas) volvía a correr esto entero y el resultado quedaba pegado a su
  # PR, aunque no la tocara. Mismo problema que #118 ya corrigió en laws-links.yml.
  push:
    branches: [master]
    paths:
      - 'privacy-laws/**'
      - 'copyright-laws/**'
      - 'leyes-comunes/**'
      - '.github/workflows/laws-modules.yml'
  pull_request:
    paths:
      - 'privacy-laws/**'
      - 'copyright-laws/**'
      - 'leyes-comunes/**'
      - '.github/workflows/laws-modules.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  test:
    name: ${{ matrix.module }} / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module: [privacy-laws, copyright-laws]
        php-version: ['8.1', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the change-history check compares with the base branch

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: curl, dom, mbstring, intl
          coverage: none

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: PHP syntax
        run: find . -name '*.php' -not -path './node_modules/*' -print0 | xargs -0 -n1 php -l

      - name: Validate the master CSV
        run: npm run validate

      - name: The PHP importer reads every row with the header's number of fields
        run: |
          php -r '
            $csv = glob("{countries,jurisdictions}/*_master.csv", GLOB_BRACE)[0];
            $f = fopen($csv, "r");
            $header = fgetcsv($f);
            $rows = 0;
            while (($row = fgetcsv($f)) !== false) {
              if (count($row) !== count($header)) { fwrite(STDERR, "row " . ($rows + 2) . ": " . count($row) . " fields\n"); exit(1); }
              $rows++;
            }
            echo "$csv: $rows rows, " . count($header) . " columns\n";
          '

      - name: Generated files are up to date
        run: npm run build:check

      - name: Every edit of the CSV is in the change history
        if: github.event_name == 'pull_request'
        run: |
          # The script exists once the module has the change-history tooling.
          if [ -f scripts/record-changes.js ]; then
            npm run changes -- --check --since=origin/${{ github.base_ref }}
          fi

      - name: Unit, API and text-cache tests
        run: npm test

      - name: Browser and accessibility tests
        if: matrix.php-version == '8.4'
        env:
          E2E_REQUIRED: '1'
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e

  # import_database.php had never run against a database: its first real run (MariaDB 10.11, October
  # 2026) found a schema too narrow for the data ("Data too long for column"), and a failed import
  # that left half the rows in place, which a second run then duplicated. This job runs it on the two
  # servers the document-formats importer is tested on and compares every column with the CSV.
  database:
    name: ${{ matrix.module }} / ${{ matrix.db.name }} import
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module: [privacy-laws, copyright-laws]
        db:
          - { name: MySQL 8.0, image: 'mysql:8.0' }
          - { name: MariaDB 10.11, image: 'mariadb:10.11' }

    services:
      mysql:
        image: ${{ matrix.db.image }}
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      DB_HOST: 127.0.0.1
      DB_PORT: '3306'
      DB_USER: root
      DB_PASSWORD: root

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_mysql
          coverage: none

      - name: Create the schema, import the CSV and validate
        run: php import_database.php --all

      - name: Compare every column with the CSV
        run: php tests/database_check.php

      - name: Import again (it replaces the rows, it does not add them) and compare again
        run: |
          php import_database.php --import
          php tests/database_check.php
