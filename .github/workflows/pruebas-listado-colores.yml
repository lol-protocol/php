name: Pruebas Listado-colores

# Misma convencion que los demas proyectos del repo: solo cuando cambia este
# proyecto (o este archivo), en los pull requests y en master.

on:
  push:
    branches: [master]
    paths:
      - "Listado-colores/**"
      - ".github/workflows/pruebas-listado-colores.yml"
  pull_request:
    paths:
      - "Listado-colores/**"
      - ".github/workflows/pruebas-listado-colores.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  listado-colores:
    name: "Listado-colores: CSV válidos y tabla del README al día"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Valida los CSV y CHANGELOG.md, y falla si algun archivo generado no coincide
      # con lo que generan (la lista esta en el README de Listado-colores, «Archivos»;
      # no se repite aqui para que no quede vieja); construye
      # ademas una base SQLite en memoria y comprueba que los recuentos coincidan.
      # Tarda entre 13 y 20 s porque recalcula el color CSS mas cercano de cada nombre.
      - name: Comprobar datos y tabla
        working-directory: Listado-colores
        run: python3 generar-tabla.py --comprobar

      # El visor de revision ya no se guarda en el repositorio (pesaba 1,2 MB y repetia los
      # datos de exportes/colores.jsonl): se construye aqui y se sube como artefacto, para que
      # quien revisa lo descargue sin instalar nada.
      - name: Construir el visor de revision
        working-directory: Listado-colores
        run: python3 generar-tabla.py --visor "$RUNNER_TEMP/visor-revision.html"

      - name: Subir el visor de revision
        uses: actions/upload-artifact@v7
        with:
          name: visor-revision
          path: ${{ runner.temp }}/visor-revision.html
          if-no-files-found: error

      # spaCy solo para una prueba: que los patrones de exportes/spacy/ carguen en un
      # EntityRuler. Sin el, esa prueba se omite y nadie la corre en la CI. En un venv
      # porque el Python del runner no deja instalar paquetes (PEP 668). La version es
      # la que se probo a mano (3.8.16); la matriz de abajo no lo instala (spaCy no
      # tiene ruedas para todas esas versiones de Python) y omite la prueba.
      - name: Instalar spaCy
        run: python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install --quiet spacy==3.8.16

      # Pruebas del generador: cada regla de validacion rota a proposito sobre una
      # copia de los CSV, y main() de punta a punta en una carpeta temporal con
      # nombres-completos.csv reducido. Unos 40 s; no escribe en el proyecto.
      - name: Pruebas del generador
        working-directory: Listado-colores
        run: '"$RUNNER_TEMP/venv/bin/python" -m unittest -v pruebas'


  # Lo mismo en otras versiones de Python y en macOS. El README dice que el desempate del
  # color CSS mas cercano redondea a 9 decimales para no depender de la coma flotante entre
  # plataformas: --comprobar recalcula las 31.935 distancias y las compara con el archivo
  # guardado, asi que un resultado distinto en macOS (arm64, otra libreria matematica) o en
  # otra version de Python haria fallar este job. El job de arriba (Python del runner) se
  # queda como esta. Runners fijados, como en el resto del repo.
  listado-colores-matriz:
    name: "Listado-colores / Python ${{ matrix.python-version }} en ${{ matrix.os }}"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python-version: "3.10"
          - os: ubuntu-24.04
            python-version: "3.14"
          - os: macos-15
            python-version: "3.13"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Comprobar datos y tabla
        working-directory: Listado-colores
        run: python3 generar-tabla.py --comprobar

      - name: Pruebas del generador
        working-directory: Listado-colores
        run: python3 -m unittest -v pruebas
