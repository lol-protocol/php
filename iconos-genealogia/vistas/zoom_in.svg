<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <defs>
    <linearGradient id="grad_zoom_in_1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#60A5FA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_zoom_in_2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#F472B6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad_zoom_in_3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#34D399;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#10B981;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow_zoom_in">
      <feDropShadow dx="2" dy="3" stdDeviation="2" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Sombra -->
  <ellipse cx="32" cy="55" rx="13" ry="3" fill="#000" opacity="0.15"/>

  <!-- Círculo de zoom 2.5D -->
  <circle cx="28" cy="28" r="11" fill="url(#grad_zoom_in_1)" stroke="#1E40AF" stroke-width="1.5" filter="url(#shadow_zoom_in)"/>
  <path d="M 39 28 A 11 11 0 0 0 38 34" fill="none" stroke="#1E40AF" stroke-width="1.5" opacity="0.3"/>

  <!-- Brillo -->
  <ellipse cx="22" cy="22" rx="5" ry="4" fill="#60A5FA" opacity="0.3"/>

  <!-- Mango -->
  <line x1="37" y1="37" x2="48" y2="48" stroke="#3B82F6" stroke-width="2.5" stroke-linecap="round"/>
  <circle cx="48" cy="48" r="1.5" fill="#3B82F6"/>

  <!-- Signo + en el interior -->
  <line x1="28" y1="22" x2="28" y2="34" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="22" y1="28" x2="34" y2="28" stroke="#FFF" stroke-width="1.5" stroke-linecap="round"/>
  </svg>