name: Tests

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  phpunit:
    name: PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: defamatory-content-review
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: phpstan:2.1

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        run: ./vendor/bin/phpunit

      - name: Static analysis
        run: phpstan analyse --no-progress

      - name: Benchmark smoke run
        run: php bin/benchmark.php 2000

  phone-directory:
    name: phone-directory / PHP ${{ matrix.php-version }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-directory
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3', '8.4']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: phonedir_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pdo_pgsql
          coverage: none

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress

      - name: Run tests
        env:
          PHONEDIR_PGSQL_DSN: pgsql:host=127.0.0.1;port=5432;dbname=phonedir_test;user=postgres;password=postgres
        run: ./vendor/bin/phpunit

      - name: Run examples
        run: for f in examples/*.php; do echo "$f"; php "$f" > /dev/null; done

      - name: Benchmark smoke run
        run: php bin/benchmark.php 2000

  phone-directory-ports:
    name: phone-directory / Python and Java ports
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: phone-directory/ports

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Python port tests
        working-directory: phone-directory/ports/python
        run: python -m unittest -v

      - name: Java port checks
        working-directory: phone-directory/ports/java
        run: |
          javac -encoding UTF-8 -d build *.java
          java -cp build PhoneDirectoryParserTest

  web-animations:
    name: Web animations (smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web-animations

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Open every animation in a browser
        run: npm test
