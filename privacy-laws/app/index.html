<!DOCTYPE html>
<html lang="en" data-lang="eng">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="page.title">Privacy Laws by Country</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%90%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles/base.css" />
  <link rel="stylesheet" href="styles/search.css" />
  <link rel="stylesheet" href="styles/comparison.css" />
  <link rel="stylesheet" href="styles/filters.css" />
  <link rel="modulepreload" href="privacy-laws.js" />
  <link rel="modulepreload" href="translations/i18n.js" />
  <link rel="modulepreload" href="lib/data.js" />
  <link rel="modulepreload" href="lib/domain.js" />
  <link rel="modulepreload" href="lib/filters.js" />
  <link rel="modulepreload" href="lib/chart.js" />
  <link rel="modulepreload" href="lib/util.js" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="header-top">
        <div>
          <h1><span aria-hidden="true">🔐</span> <span data-i18n="page.heading">Privacy Laws by Country</span></h1>
          <p class="subtitle" data-i18n="page.subtitle">
            Find privacy legislation and regulations for genealogy, compliance, and research
          </p>
        </div>
        <div class="language-switcher">
          <label for="languageSelect" data-i18n="lang.label">Language</label>
          <select id="languageSelect"></select>
        </div>
      </div>
    </header>

    <main class="main-content">
      <p id="status" class="empty-state-block" role="alert" hidden></p>

      <section class="search-section">
        <form id="searchForm" class="search-container" role="search">
          <div class="search-row">
            <div class="search-field">
              <label for="q" data-i18n="search.label">Search</label>
              <input
                type="search"
                id="q"
                list="countryList"
                autocomplete="off"
                maxlength="200"
                data-i18n-placeholder="search.placeholder"
              />
              <datalist id="countryList"></datalist>
              <small class="field-hint" data-i18n="search.hint"></small>
            </div>
            <div class="search-field">
              <label for="scope" data-i18n="search.scope">Search in</label>
              <select id="scope"></select>
            </div>
          </div>

          <details id="advanced" class="advanced-filters">
            <summary>
              <span data-i18n="filters.advanced">Advanced filters</span>
              <span id="filterCount" class="badge" hidden></span>
            </summary>
            <div id="facets" class="facets"></div>
          </details>

          <div id="chips" class="chips" role="group" data-i18n-aria-label="filters.activeLabel" hidden></div>

          <div class="button-group">
            <button type="submit" id="searchBtn" class="btn btn-primary" data-i18n="btn.search">Search</button>
            <button type="button" id="clearBtn" class="btn btn-secondary" data-i18n="btn.clear">Clear</button>
          </div>
        </form>
      </section>

      <section id="countryCard" class="country-card" hidden></section>

      <section class="results-section">
        <div class="results-header">
          <div>
            <h2 id="resultsTitle" data-i18n="results.title">Privacy laws</h2>
            <p id="resultsSummary" class="results-summary" role="status" aria-live="polite"></p>
          </div>
          <div class="results-meta">
            <button id="compareBtn" type="button" class="btn btn-sm btn-info"></button>
            <button id="exportBtn" type="button" class="btn btn-sm btn-outline" data-i18n="btn.export">Export CSV</button>
          </div>
        </div>

        <div id="chart" class="viz-host"></div>

        <div id="tableWrap" class="table-container">
          <table id="lawsTable" class="data-table">
            <caption class="sr-only" data-i18n="table.caption"></caption>
            <thead>
              <tr>
                <th scope="col">
                  <input type="checkbox" id="selectAll" data-i18n-aria-label="table.selectAll" />
                </th>
                <th scope="col" data-i18n="table.country">Country</th>
                <th scope="col" data-i18n="table.law">Law</th>
                <th scope="col" data-i18n="table.enacted">Enacted</th>
                <th scope="col" data-i18n="table.effective">In force</th>
                <th scope="col" data-i18n="table.authority">Enforcement authority</th>
                <th scope="col" data-i18n="table.penalties">Penalties</th>
                <th scope="col" data-i18n="table.reference">Reference</th>
              </tr>
            </thead>
            <tbody id="lawsTableBody"></tbody>
          </table>
        </div>

        <div id="emptyState" class="empty-state-block" hidden>
          <p data-i18n="results.none"></p>
          <p><small data-i18n="results.noneHint"></small></p>
        </div>
      </section>

      <section class="comparison-section" id="comparisonSection" hidden>
        <h2 data-i18n="compare.title">Law comparison</h2>
        <div class="comparison-container" tabindex="0" role="region" data-i18n-aria-label="compare.title">
          <div id="comparisonResults"></div>
        </div>
        <button id="closeComparison" type="button" class="btn btn-sm" data-i18n="btn.close">Close</button>
      </section>
    </main>

    <footer class="footer">
      <p id="footerData"></p>
      <p><small data-i18n="footer.note"></small></p>
    </footer>
  </div>

  <script type="module" src="privacy-laws.js"></script>
</body>
</html>
