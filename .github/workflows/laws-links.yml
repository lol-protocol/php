name: Leyes - enlaces de referencia

# Weekly check that the reference URLs of both datasets still answer.
# A broken link fails the job (GitHub then notifies); the summary lists every problem.
on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:
  # Also when the check itself changes. Only master and PRs: without the branch filter, any branch that
  # merged master re-ran it on push and its red result showed up on unrelated PRs.
  push:
    branches: [master]
    paths:
      - '.github/workflows/laws-links.yml'
      - 'privacy-laws/scripts/check-links.js'
      - 'copyright-laws/scripts/check-links.js'
  pull_request:
    paths:
      - '.github/workflows/laws-links.yml'
      - 'privacy-laws/scripts/check-links.js'
      - 'copyright-laws/scripts/check-links.js'

permissions:
  contents: read

jobs:
  links:
    name: enlaces ${{ matrix.module }}
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    strategy:
      fail-fast: false
      matrix:
        module: [privacy-laws, copyright-laws]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js 22
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Check reference links
        run: npm run check:links -- --json=links-report.json

      # One annotation per broken link, so the failing URLs show on the check (and through the API)
      # without downloading the artifact. Workflow commands need %, \r and \n escaped.
      - name: Annotate broken links
        if: always() && hashFiles(format('{0}/links-report.json', matrix.module)) != ''
        run: |
          jq -r '.results[] | select(.status == "broken")
            | "\(.url) -> \(.detail) [\(.laws | join("; "))]"
            | gsub("%"; "%25") | gsub("\r"; "%0D") | gsub("\n"; "%0A")
            | "::error title=Enlace roto::\(.)"' links-report.json

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: links-report-${{ matrix.module }}
          path: ${{ matrix.module }}/links-report.json
          if-no-files-found: ignore
